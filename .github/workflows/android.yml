name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spotnav-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # The phone's zone must never change a plan: the unit tests also run with the JVM pinned to zones
  # other than the price areas' own.
  device-zones:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zone: [UTC, America/New_York]
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=${{ matrix.zone }} -Duser.language=en -Duser.country=US
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests in ${{ matrix.zone }}
        run: ./gradlew testDebugUnitTest

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_STORE_PATH: ${{ github.workspace }}/release.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASS }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$SIGNING_STORE_PATH"
      # Released builds carry the opt-in instant notifications: Firebase is built in only when
      # app/google-services.json is present, and -Ppush=true below fails the build if it is not.
      - name: Restore Firebase app configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - name: Unit tests and lint (github store)
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Unit tests (play store)
        run: ./gradlew -Pstore=play testDebugUnitTest
      # Both stores write to app/build/outputs, so each artifact is renamed before the next build.
      - name: Build GitHub APK
        run: |
          ./gradlew -Pstore=github -Ppush=true -PreleaseVersion="${GITHUB_REF_NAME#v}" assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "spotnav-${GITHUB_REF_NAME#v}.apk"
      - name: Build Play bundle
        run: |
          ./gradlew -Pstore=play -Ppush=true -PreleaseVersion="${GITHUB_REF_NAME#v}" bundleRelease
          mv app/build/outputs/bundle/release/app-release.aab "spotnav-${GITHUB_REF_NAME#v}-play.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: spotnav-release
          path: |
            spotnav-*.apk
            spotnav-*-play.aab
      - name: Publish GitHub release
        # The notes are a file in the repository (release-notes/<version>.md), so line breaks and
        # wording are reviewed like code; without one the release is not published.
        run: |
          notes="release-notes/${GITHUB_REF_NAME#v}.md"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "spotnav-${GITHUB_REF_NAME#v}.apk" --title "SpotNav ${GITHUB_REF_NAME#v}" --notes-file "$notes" --verify-tag
